name: setup-factory
description: >-
  Set up Python 3.12, install the factory's pinned requirements, make the
  factory package importable and put $HOME/.factory/bin on PATH. Expects the
  factory repo to be checked out already (usually at .factory/).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install factory
      shell: bash
      run: |
        factory_dir="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        python -m pip install -r "$factory_dir/requirements-dev.txt"
        site_dir="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
        echo "$factory_dir" > "$site_dir/security-factory.pth"
        python -c 'import factory, sys; print("factory", factory.__version__, "from", factory.__file__)'
    # The only value written is the literal $HOME/.factory/bin, never workflow input.
    - name: Put factory tools on PATH
      shell: bash
      run: | # zizmor: ignore[github-env]
        mkdir -p "$HOME/.factory/bin"
        echo "$HOME/.factory/bin" >> "$GITHUB_PATH"
