name: selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - run: make test
      - name: sarif contract check
        run: |
          python -m factory.sarif tests/fixtures/codeql.sarif --stage sast-codeql --tool codeql > first.json
          python -m factory.sarif tests/fixtures/codeql.sarif --stage sast-codeql --tool codeql > second.json
          cmp first.json second.json
          python -c "import json; from factory import findings; items = findings.validate(json.load(open('first.json'))); print({f['rule_id']: f['severity'] for f in items})"
          sha256sum first.json second.json
      - name: authorize refuses a mocked unauthorized issues event
        run: |
          printf '%s' '{"action":"labeled","label":{"name":"factory:spec"},"sender":{"login":"mallory"},"issue":{"number":1}}' > "$RUNNER_TEMP/event.json"
          SENDER=$(jq -r .sender.login "$RUNNER_TEMP/event.json")
          if python -m factory.authorize --mode spec --actor "$SENDER" --author AakashDadhich --allowed AakashDadhich; then
            echo "unauthorized actor was accepted"; exit 1
          fi
          python -m pytest -q tests/test_plan_stage.py -k "mocked or outsiders or model_jobs_are_skipped"
      - name: render security rules
        run: |
          python -m factory.rules render --platform web --asvs-level 2 --target claude --out "$RUNNER_TEMP/rules/CLAUDE.md"
          grep -E '^## (Base|Secure defaults|Web|ASVS L1\+L2)$' "$RUNNER_TEMP/rules/CLAUDE.md"
          if grep -qE '^- \*\*V[0-9.]+\*\* \(L3\)' "$RUNNER_TEMP/rules/CLAUDE.md"; then echo "L3 requirement found at L2"; exit 1; fi
          grep -c '(L1)' "$RUNNER_TEMP/rules/CLAUDE.md"
          grep -c '(L2)' "$RUNNER_TEMP/rules/CLAUDE.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-rules
          path: ${{ runner.temp }}/rules/

  secrets-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - run: python -m factory.tools install gitleaks
      - name: secrets stage on a throwaway repo
        env:
          FACTORY_REQUIRE_GITLEAKS: "1"
          FACTORY_SECRETS_IT_OUT: ${{ runner.temp }}/secrets-it
        run: python -m pytest -v -s tests/test_secrets.py -k integration
      - name: check the SARIF is redacted
        env:
          OUT: ${{ runner.temp }}/secrets-it
        run: |
          echo "REDACTED lines in gitleaks.sarif: $(grep -c REDACTED "$OUT/gitleaks.sarif")"
          python -c "import json, sys; n = len(json.load(open(sys.argv[1]))); print(f'{n} findings'); sys.exit(n != 2)" "$OUT/findings.json"

  pytm-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - run: python -m factory.tools install pytm pytm-sandbox
      - name: threat model tests with the real pytm
        env:
          FACTORY_REQUIRE_PYTM: "1"
        run: python -m pytest -v -s tests/test_threat_model.py
      - name: pytm runner refuses import os and runs the notes model
        run: |
          if python -m factory.threatmodel.pytm_runner tests/fixtures/threat-model/tm_import_os.py --out "$RUNNER_TEMP/tm-bad"; then
            echo "tm_import_os.py was accepted"; exit 1
          fi
          python -m factory.threatmodel.pytm_runner tests/fixtures/threat-model/tm_notes.py --out "$RUNNER_TEMP/tm-good"
          head -n 5 "$RUNNER_TEMP/tm-good/dfd.dot"

  codegen-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - run: python -m factory.tools install semgrep semgrep-rules gitleaks pre-commit
      - name: real pre-commit hooks block insecure code and secrets
        env:
          FACTORY_REQUIRE_HOOKS: "1"
        run: python -m pytest -v -s tests/test_codegen.py -k integration

  semgrep-rules:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - run: python -m factory.tools install semgrep
      - name: semgrep --test
        run: semgrep --test --metrics=off --disable-version-check semgrep-rules/custom

  eslint-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/eslint
      - name: eslint stage on the eval fixture
        env:
          FACTORY_REQUIRE_ESLINT: "1"
          FACTORY_ESLINT_IT_OUT: ${{ runner.temp }}/eslint-it
        run: python -m pytest -v -s tests/test_sast_eslint.py -k integration
      - name: assert one high finding
        env:
          OUT: ${{ runner.temp }}/eslint-it
        run: |
          python -c "import json, sys; items = json.load(open(sys.argv[1])); high = [f for f in items if f['severity'] == 'high']; print(f'{len(items)} findings, {len(high)} high'); sys.exit(len(high) != 1)" "$OUT/findings.json"

  lint-workflows:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - run: python -m factory.tools install actionlint zizmor
      - name: actionlint
        run: |
          actionlint -verbose
          actionlint -verbose templates/project/.github/workflows/factory.yml
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain --config .github/zizmor.yml .github/workflows .github/actions templates/project/.github/workflows/factory.yml

  macos-smoke:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - run: python -m factory.tools list
      - run: python -m factory.platform_check ensure-make
      - run: make ensure-make
      - name: install the macOS tools from the lock
        run: python -m factory.tools install xcode xcodegen swiftlint
      - name: tools run
        run: |
          xcodegen --version
          swiftlint version
          find "$HOME/.factory/xcodegen/xcodegen/share/xcodegen/SettingPresets" -maxdepth 1 | head -3
          xcodebuild -version
      - name: codesign integration
        env:
          FACTORY_REQUIRE_CODESIGN: "1"
        run: python -m pytest -v tests/test_apple_checks.py -k integration
