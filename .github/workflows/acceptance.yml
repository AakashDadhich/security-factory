name: acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

concurrency:
  group: acceptance
  cancel-in-progress: false

env:
  PYTHONSAFEPATH: '1'
  TARGET_OWNER: AakashDadhich

jobs:
  acceptance:
    name: acceptance (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [factory-vuln-web, factory-vuln-ios]
    env:
      TARGET_NAME: ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-factory
      - name: mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ env.TARGET_OWNER }}
          repositories: ${{ env.TARGET_NAME }}
          permission-actions: write
          permission-contents: read
      - name: dispatch the factory on the vulnerable app and wait
        id: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python -m factory.acceptance_run --repo "$TARGET_OWNER/$TARGET_NAME" --ref main --factory-ref "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: check the gate against the expected findings
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          gh api "repos/$TARGET_OWNER/$TARGET_NAME/contents/expected-findings.yml" -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/expected-findings.yml"
          python -m factory.acceptance --repo "$TARGET_OWNER/$TARGET_NAME" --run-id "$RUN_ID" --expect-factory-commit "$GITHUB_SHA" --expected "$RUNNER_TEMP/expected-findings.yml" --out out/acceptance | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-${{ matrix.target }}
          path: out/acceptance/
          if-no-files-found: ignore
