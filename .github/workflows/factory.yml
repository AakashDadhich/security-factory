name: factory

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: check
      factory-ref:
        type: string
        default: main
      config-path:
        type: string
        default: .factory.yml
      issue:
        description: Issue number for spec and change modes, 0 otherwise
        type: number
        default: 0
      iteration:
        description: Fix loop round (1 or 2) in fix mode, 0 otherwise
        type: number
        default: 0
      findings-run-id:
        description: Run whose gate artifact holds the findings to fix, fix mode only
        type: number
        default: 0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      FACTORY_APP_PRIVATE_KEY:
        required: false

permissions: {}

concurrency:
  group: ${{ (inputs.mode == 'spec' || inputs.mode == 'change' || inputs.mode == 'fix') && format('factory-issue-{0}', inputs.issue) || format('factory-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

# Project code is checked out at the workspace root; without this, `python -m`
# would import a project's own `factory/`, `yaml.py` or `pip/` ahead of ours.
env:
  PYTHONSAFEPATH: "1"

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - name: check the triggering user
        env:
          PYTHONPATH: .factory
          MODE: ${{ inputs.mode }}
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ALLOWED: ${{ vars.FACTORY_ALLOWED_ACTORS }}
          ISSUE: ${{ inputs.issue }}
          ITERATION: ${{ inputs.iteration }}
          FINDINGS_RUN_ID: ${{ inputs.findings-run-id }}
        run: >-
          python3 -m factory.authorize --mode "$MODE" --actor "$SENDER" --author "$AUTHOR" --allowed "$ALLOWED"
          --issue "$ISSUE" --iteration "$ITERATION" --findings-run-id "$FINDINGS_RUN_ID"

  setup:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      platform: ${{ steps.config.outputs.platform }}
      asvs_level: ${{ steps.config.outputs.asvs_level }}
      openapi: ${{ steps.config.outputs.openapi }}
      has-claude: ${{ steps.claude.outputs.present }}
    steps:
      - name: check for Claude token
        id: claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then present=true; else present=false; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "Claude token present: $present"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - name: validate config
        id: config
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: python -m factory.config --path "$CONFIG_PATH"
      - name: write run manifest
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          MODE: ${{ inputs.mode }}
          FACTORY_REF: ${{ inputs.factory-ref }}
          ISSUE: ${{ inputs.issue }}
          ITERATION: ${{ inputs.iteration }}
        run: >-
          python -m factory.manifest create
          --config "$CONFIG_PATH" --mode "$MODE" --factory-ref "$FACTORY_REF" --issue "$ISSUE" --iteration "$ITERATION"
          --stage plan --stage threat-model --stage codegen-ai --stage codegen-commit --stage review --stage passthrough --stage hello-ai --stage secrets --stage sast-semgrep --stage sast-codeql --stage sast-eslint --stage deps-sbom --stage dast-web --stage gate
          --out out/setup/run-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup
          path: out/setup/
          if-no-files-found: error

  ai-eligible:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_ai: ${{ steps.decide.outputs.run_ai }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - name: decide whether the AI stages run
        id: decide
        env:
          PYTHONPATH: .factory
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
          HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HAS_SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: >-
          python3 -m factory.eligibility --mode "$MODE" --event "$EVENT" --head-fork "$HEAD_FORK"
          --ref "$REF" --default-branch "$DEFAULT_BRANCH" --has-secret "$HAS_SECRET" --github-output "$GITHUB_OUTPUT"

  plan:
    needs: [authorize, setup]
    if: inputs.mode == 'spec' || inputs.mode == 'change'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install claude-code
      - name: fetch the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
        run: |
          mkdir -p out/plan
          gh issue view "$ISSUE" --repo "$REPO" --json title,body > out/plan/issue.json
      - name: read the project record
        if: inputs.mode == 'change'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python -m factory.record read --repo "$REPO" --out in/record
      - name: plan stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FACTORY_MODEL_ADAPTER: claude_code
          FACTORY_CLAUDE_TIMEOUT: "600"
          FACTORY_CLAUDE_MAX_TURNS: "10"
          CONFIG_PATH: ${{ inputs.config-path }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = change ]; then
            python -m factory.stages.plan --issue-file out/plan/issue.json --config "$CONFIG_PATH" --out out/plan --current-plan security/plan.json --record in/record
          else
            python -m factory.stages.plan --issue-file out/plan/issue.json --config "$CONFIG_PATH" --out out/plan
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plan
          path: out/plan/
          if-no-files-found: error

  plan-comment:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: in/plan
      - name: render the comment
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m factory.plan_comment --plan in/plan/plan.json --out out/plan-comment/comment.md --run-url "$RUN_URL"
      - name: post the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
        run: gh issue comment "$ISSUE" --repo "$REPO" --body-file out/plan-comment/comment.md

  threat-model:
    needs: [setup, plan, ai-eligible]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (((inputs.mode == 'spec' || inputs.mode == 'change') && needs.plan.result == 'success') || (inputs.mode == 'check' && needs.ai-eligible.outputs.run_ai == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install claude-code pytm pytm-sandbox
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mode != 'check'
        with:
          name: plan
          path: in/plan
      # Check mode has no plan: the model is updated from security/ (or bootstrapped from the code) and the diff.
      - name: diff for check mode
        if: inputs.mode == 'check'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          case "$base" in ""|0000000000000000000000000000000000000000) base=$(git hash-object -t tree /dev/null) ;; esac
          mkdir -p in/diff
          git diff --no-color "$base" HEAD -- . ':(exclude)security' | head -c 200000 > in/diff/diff.patch
      # pytm runs AI-written Python: the stage checks it against an AST allowlist first, then runs it
      # in a no-network, read-only container so it cannot reach this job's processes or the token.
      - name: threat model stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FACTORY_MODEL_ADAPTER: claude_code
          FACTORY_CLAUDE_TIMEOUT: "900"
          FACTORY_CLAUDE_MAX_TURNS: "15"
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = check ]; then
            python -m factory.stages.threat_model --diff in/diff/diff.patch --previous security --out out/threat-model
          else
            python -m factory.stages.threat_model --plan in/plan/plan.json --previous security --out out/threat-model
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: threat-model
          path: out/threat-model/
          if-no-files-found: error

  fix-input:
    needs: setup
    if: inputs.mode == 'fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - name: download the gate result of the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FINDINGS_RUN_ID: ${{ inputs.findings-run-id }}
        run: gh run download "$FINDINGS_RUN_ID" --repo "$REPO" --name gate --name setup --dir in
      - name: select the blocking findings
        env:
          ISSUE: ${{ inputs.issue }}
          ITERATION: ${{ inputs.iteration }}
        run: python -m factory.fixloop blocking --gate in/gate --setup in/setup --issue "$ISSUE" --iteration "$ITERATION" --out out/fix-input/blocking.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-input
          path: out/fix-input/
          if-no-files-found: error

  codegen-ai:
    needs: [setup, plan, threat-model, fix-input]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (((inputs.mode == 'spec' || inputs.mode == 'change') && needs.plan.result == 'success' && needs.threat-model.result == 'success') || (inputs.mode == 'fix' && needs.fix-input.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.codegen.outputs.base_sha || steps.fix.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install claude-code semgrep semgrep-rules gitleaks pre-commit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mode != 'fix'
        with:
          name: plan
          path: in/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mode != 'fix'
        with:
          name: threat-model
          path: in/threat-model
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mode == 'fix'
        with:
          name: fix-input
          path: in/fix-input
      # The agent only reads and writes files in a copy of the repository that has no .git folder. Nothing it
      # writes is executed here: Semgrep and Gitleaks only read it, and this job holds no write credential.
      - name: codegen stage
        id: codegen
        if: inputs.mode != 'fix'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FACTORY_MODEL_ADAPTER: claude_code
          FACTORY_CLAUDE_TIMEOUT: "1200"
          FACTORY_CLAUDE_MAX_TURNS: "80"
          PLATFORM: ${{ needs.setup.outputs.platform }}
          ISSUE: ${{ inputs.issue }}
        run: >-
          python -m factory.stages.codegen --plan in/plan/plan.json --threat-model in/threat-model
          --platform "$PLATFORM" --issue "$ISSUE" --out out/codegen --github-output "$GITHUB_OUTPUT"
      # Fix mode reads security/ from factory/<issue> and gets only the blocking findings, never the plan artifacts.
      - name: fix stage
        id: fix
        if: inputs.mode == 'fix'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FACTORY_MODEL_ADAPTER: claude_code
          FACTORY_CLAUDE_TIMEOUT: "1200"
          FACTORY_CLAUDE_MAX_TURNS: "60"
          PLATFORM: ${{ needs.setup.outputs.platform }}
          ISSUE: ${{ inputs.issue }}
          ITERATION: ${{ inputs.iteration }}
        run: >-
          python -m factory.stages.codegen --fix-findings in/fix-input/blocking.json
          --platform "$PLATFORM" --issue "$ISSUE" --iteration "$ITERATION" --out out/codegen --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codegen-ai
          path: out/codegen/
          if-no-files-found: error

  codegen-commit:
    needs: [setup, codegen-ai]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.codegen-ai.result == 'success' && (inputs.mode == 'spec' || inputs.mode == 'change' || inputs.mode == 'fix') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-ai.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install semgrep semgrep-rules gitleaks pre-commit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codegen-ai
          path: in/codegen
      # The patch is untrusted AI output. It is checked, applied and committed before any token exists in this job.
      - name: apply and commit the patch
        id: apply
        env:
          PLATFORM: ${{ needs.setup.outputs.platform }}
        run: >-
          python -m factory.stages.codegen_commit apply --codegen in/codegen --platform "$PLATFORM"
          --out out/codegen-commit --github-output "$GITHUB_OUTPUT"
      - name: mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: push factory branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python -m factory.stages.codegen_commit push --slug "$REPO"
          --commit-file out/codegen-commit/commit.json --default-branch "$DEFAULT_BRANCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codegen-commit
          path: out/codegen-commit/
          if-no-files-found: error

  review:
    needs: [setup, codegen-commit, ai-eligible]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (((inputs.mode == 'spec' || inputs.mode == 'change' || inputs.mode == 'fix') && needs.codegen-commit.result == 'success') || (inputs.mode == 'check' && needs.ai-eligible.outputs.run_ai == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-commit.outputs.sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install claude-code
      # The reviewer only has Read, Grep and Glob, and this job holds no write credential or App key.
      - name: security review stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FACTORY_MODEL_ADAPTER: claude_code
          FACTORY_CLAUDE_TIMEOUT: "900"
          FACTORY_CLAUDE_MAX_TURNS: "25"
          ASVS_LEVEL: ${{ needs.setup.outputs.asvs_level }}
          MODE: ${{ inputs.mode }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$MODE" in
            spec|change|fix) base="origin/$DEFAULT_BRANCH" ;;
            *) base="${PR_BASE:-$PUSH_BEFORE}" ;;
          esac
          case "$base" in ""|0000000000000000000000000000000000000000) base=$(git hash-object -t tree /dev/null) ;; esac
          python -m factory.stages.review --base "$base" --head HEAD --asvs-level "$ASVS_LEVEL" --out out/review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: review
          path: out/review/
          if-no-files-found: error

  passthrough:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup
          path: in/setup
      - run: python -m factory.passthrough --manifest in/setup/run-manifest.json --out out/passthrough/findings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passthrough
          path: out/passthrough/
          if-no-files-found: error

  hello-ai:
    needs: setup
    if: needs.setup.outputs.has-claude == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install claude-code
      - name: hello stage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FACTORY_MODEL_ADAPTER: claude_code
          FACTORY_CLAUDE_TIMEOUT: "300"
          FACTORY_CLAUDE_MAX_TURNS: "3"
        run: >-
          python -m factory.adapter run --stage hello-ai
          --prompt .factory/prompts/hello.md
          --schema .factory/schemas/hello.schema.json
          --out out/hello-ai/hello.json
      - run: echo '[]' > out/hello-ai/findings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hello-ai
          path: out/hello-ai/
          if-no-files-found: error

  secrets:
    needs: [setup, codegen-commit, review]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.codegen-commit.result == 'success' || (inputs.mode != 'spec' && inputs.mode != 'change' && inputs.mode != 'fix')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-commit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install gitleaks
      - run: python -m factory.stages.secrets --repo . --out out/secrets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secrets
          path: out/secrets/
          if-no-files-found: error

  sast-semgrep:
    needs: [setup, codegen-commit, review]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.codegen-commit.result == 'success' || (inputs.mode != 'spec' && inputs.mode != 'change' && inputs.mode != 'fix')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-commit.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install semgrep semgrep-rules
      - name: semgrep
        env:
          PLATFORM: ${{ needs.setup.outputs.platform }}
        run: python -m factory.stages.sast_semgrep --platform "$PLATFORM" --src . --out out/sast-semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-semgrep
          path: out/sast-semgrep/
          if-no-files-found: error

  sast-codeql:
    needs: [setup, codegen-commit, review]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.codegen-commit.result == 'success' || (inputs.mode != 'spec' && inputs.mode != 'change' && inputs.mode != 'fix')) && needs.setup.outputs.platform == 'web' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-commit.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - .factory
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
          output: out/sast-codeql
          upload: always
      - name: convert SARIF to findings
        run: |
          python -m factory.sarif out/sast-codeql/javascript.sarif \
            --stage sast-codeql --tool codeql --out out/sast-codeql/findings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-codeql
          path: out/sast-codeql/
          if-no-files-found: error

  sast-eslint:
    needs: [setup, codegen-commit, review]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.codegen-commit.result == 'success' || (inputs.mode != 'spec' && inputs.mode != 'change' && inputs.mode != 'fix')) && needs.setup.outputs.platform == 'web' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-commit.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: eslint
        run: python -m factory.stages.sast_eslint --src . --out out/sast-eslint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-eslint
          path: out/sast-eslint/
          if-no-files-found: error

  deps-sbom:
    needs: [setup, codegen-commit, review]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.codegen-commit.result == 'success' || (inputs.mode != 'spec' && inputs.mode != 'change' && inputs.mode != 'fix')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-commit.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install osv-scanner syft grype
      - name: deps-sbom
        run: python -m factory.stages.deps_sbom --src . --out out/deps-sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deps-sbom
          path: out/deps-sbom/
          if-no-files-found: error

  dast-web:
    needs: [setup, codegen-commit, review]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.codegen-commit.result == 'success' || (inputs.mode != 'spec' && inputs.mode != 'change' && inputs.mode != 'fix')) && needs.setup.outputs.platform == 'web' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-commit.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - run: python -m factory.tools install zap curl
      - name: start app
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          RUN_ID: ${{ github.run_id }}
        run: python -m factory.dast.harness up --config "$CONFIG_PATH" --run-id "$RUN_ID"
      - name: zap full scan
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: python -m factory.stages.dast_web --config "$CONFIG_PATH" --out out/dast-web
      - name: stop app
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: python -m factory.dast.harness down --run-id "$RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dast-web
          path: out/dast-web/
          if-no-files-found: error

  gate:
    needs: [authorize, setup, ai-eligible, plan, threat-model, codegen-ai, codegen-commit, review, passthrough, hello-ai, secrets, sast-semgrep, sast-codeql, sast-eslint, deps-sbom, dast-web]
    # A refused spec, change or fix run stops at authorize. In every other mode the gate always runs and fails closed.
    if: always() && (needs.authorize.result == 'success' || (inputs.mode != 'spec' && inputs.mode != 'change' && inputs.mode != 'fix'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.codegen-commit.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: in
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: >-
          python -m factory.gate --artifacts in --config "$CONFIG_PATH"
          --manifest in/setup/run-manifest.json --out out/gate --needs "$NEEDS"
          --policy .factory/policy.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate
          path: out/gate/
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('out/gate/merged.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: out/gate/merged.sarif
          category: factory-gate

  record:
    needs: [gate]
    if: always() && needs.gate.result != 'skipped' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate
          path: in/gate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: deps-sbom
          path: in/deps-sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: threat-model
          path: in/threat-model
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: review
          path: in/review
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup
          path: in/setup
      - name: mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: record
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: >-
          python -m factory.record write --repo "$REPO" --artifacts in
          --event "$EVENT" --ref "$REF" --default-branch "$DEFAULT_BRANCH"
          --run-id "$RUN_ID" --commit "$COMMIT"
      - name: comment the dependency changes on the merged issue
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.gate.result == 'success'
        continue-on-error: true
        id: sbom-note
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p in/record out/sbom-note
          python -m factory.record read --repo "$REPO" --out in/record
          gh api "repos/$REPO/commits/$COMMIT/pulls" > in/record/pulls.json
          python -m factory.sbomnote --pulls in/record/pulls.json --diff in/record/latest/sbom-diff.json --commit "$COMMIT" --out out/sbom-note/comment.md --github-output "$GITHUB_OUTPUT"
      - name: post the dependency changes
        if: steps.sbom-note.outputs.issue != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.sbom-note.outputs.issue }}
        run: gh issue comment "$ISSUE" --repo "$REPO" --body-file out/sbom-note/comment.md

  next-step:
    needs: gate
    if: always() && needs.gate.result != 'skipped' && (inputs.mode == 'spec' || inputs.mode == 'change' || inputs.mode == 'fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AakashDadhich/security-factory
          ref: ${{ inputs.factory-ref }}
          path: .factory
          persist-credentials: false
      - uses: ./.factory/.github/actions/setup-factory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate
          path: in/gate
      - name: decide
        id: decide
        env:
          MODE: ${{ inputs.mode }}
          GATE_RESULT: ${{ needs.gate.result }}
          ITERATION: ${{ inputs.iteration }}
        run: python -m factory.fixloop decide --mode "$MODE" --gate-result "$GATE_RESULT" --iteration "$ITERATION" --github-output "$GITHUB_OUTPUT"
      - name: mint app token
        id: app-token
        if: steps.decide.outputs.action == 'dispatch'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: start the next fix run
        if: steps.decide.outputs.action == 'dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          ITERATION: ${{ inputs.iteration }}
          RUN_ID: ${{ github.run_id }}
        run: python -m factory.fixloop dispatch --repo "$REPO" --issue "$ISSUE" --iteration "$ITERATION" --run-id "$RUN_ID"
      - name: threat model diff
        if: steps.decide.outputs.action == 'done'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p in/threats out/next-step
          gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/security/threats.json?ref=factory/$ISSUE" > in/threats/head.json
          gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/security/threats.json?ref=$DEFAULT_BRANCH" > in/threats/base.json || rm -f in/threats/base.json
          python -m factory.threatmodel.diff --base in/threats/base.json --head in/threats/head.json --out-md out/next-step/threat-diff.md
      - name: comment on the issue
        if: steps.decide.outputs.action == 'stop' || steps.decide.outputs.action == 'done'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          KIND: ${{ steps.decide.outputs.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m factory.fixloop comment --kind "$KIND" --issue "$ISSUE" --report in/gate/report.md --run-url "$RUN_URL" --extra out/next-step/threat-diff.md --out out/next-step/comment.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file out/next-step/comment.md
      - name: ask for a human
        if: steps.decide.outputs.action == 'stop'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
        run: |
          gh label create factory:needs-human --repo "$REPO" --color B60205 --description "The factory gave up fixing this issue" --force
          gh issue edit "$ISSUE" --repo "$REPO" --add-label factory:needs-human
