env:
  contexts:
    - name: app
      urls:
        - "http://app:3000"
      includePaths:
        - "http://app:3000.*"
      authentication:
        method: "json"
        parameters:
          loginPageUrl: "http://app:3000/login"
          loginRequestUrl: "http://app:3000/login"
          loginRequestBody: "{\"username\":\"{%username%}\",\"password\":\"{%password%}\"}"
        verification:
          method: "response"
          loggedInRegex: "\"ok\":true"
          loggedOutRegex: "login required"
      sessionManagement:
        method: "cookie"
      users:
        - name: "test-user"
          credentials:
            username: "zap-test"
            password: "zap-pw-7f3a9c2e41d8"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
  - type: openapi
    parameters:
      apiFile: /zap/spec/openapi.yaml
      targetUrl: "http://app:3000"
      context: app
  - type: spider
    parameters:
      context: app
      user: "test-user"
      maxDuration: 2
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: app
      user: "test-user"
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 15
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: export
    parameters:
      context: app
      type: yaml
      source: sitestree
      fileName: /zap/wrk/sites-tree.yaml
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report
      reportTitle: Factory ZAP full scan
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-report
      reportTitle: Factory ZAP full scan
