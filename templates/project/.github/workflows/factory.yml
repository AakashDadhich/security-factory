name: factory

on:
  push:
    branches-ignore: ['factory/**', 'factory-record']
  pull_request:
  workflow_dispatch:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [factory-fix]

permissions: {}

jobs:
  factory:
    # The template repo itself has no secrets and is not set up for the factory, so it never runs the pipeline.
    if: github.repository != 'AakashDadhich/factory-project-template' && (github.event_name != 'issues' || github.event.label.name == 'factory:spec' || github.event.label.name == 'factory:change')
    permissions:
      contents: read
      issues: write
      actions: read
      security-events: write
    uses: AakashDadhich/security-factory/.github/workflows/factory.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      mode: ${{ github.event_name == 'repository_dispatch' && 'fix' || github.event_name == 'issues' && (github.event.label.name == 'factory:spec' && 'spec' || 'change') || 'check' }}
      issue: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.issue || github.event_name == 'issues' && github.event.issue.number || 0 }}
      iteration: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.iteration || 0 }}
      findings-run-id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.findings_run_id || 0 }}
      factory-ref: v1
    secrets: inherit # zizmor: ignore[secrets-inherit]
