env:
  contexts:
    - name: app
      urls:
        - "{{TARGET}}"
      includePaths:
        - "{{TARGET}}.*"
{{AUTH_CONTEXT}}
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
{{OPENAPI_JOB}}
  - type: spider
    parameters:
      context: app
{{USER}}
      maxDuration: 2
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: app
{{USER}}
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 15
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: export
    parameters:
      context: app
      type: yaml
      source: sitestree
      fileName: /zap/wrk/sites-tree.yaml
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report
      reportTitle: Factory ZAP full scan
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-report
      reportTitle: Factory ZAP full scan
